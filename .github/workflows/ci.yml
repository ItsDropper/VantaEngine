name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Python authoring SDK
        env:
          PYTHONPATH: tools/vanta_sdk
        run: python -m unittest discover -s tools/vanta_sdk/tests -v

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format Rust editor sources
        run: cargo fmt --manifest-path editor/app/Cargo.toml --all

      - name: Generate Rust dependency lockfile
        run: cargo generate-lockfile --manifest-path editor/app/Cargo.toml

      - name: Test Rust editor
        run: cargo test --locked --manifest-path editor/app/Cargo.toml

      - name: Lint Rust editor
        run: cargo clippy --locked --all-targets --manifest-path editor/app/Cargo.toml -- -D warnings

      - name: Build Rust editor
        run: cargo build --locked --release --manifest-path editor/app/Cargo.toml

      - name: Generate starter model
        env:
          PYTHONPATH: tools/vanta_sdk
        run: python -m vanta_sdk build --project projects/starter --output build/generated

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build Debug
        run: cmake --build build --parallel

      - name: Test Debug
        run: ctest --test-dir build --output-on-failure

      - name: Build Release
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-release --parallel

      - name: Test Release
        run: ctest --test-dir build-release --output-on-failure

      - name: Upload Windows editor
        uses: actions/upload-artifact@v4
        with:
          name: vantaengine-editor-windows-x64
          path: editor/app/target/release/vanta-editor.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated model
        uses: actions/upload-artifact@v4
        with:
          name: vantaengine-generated-models
          path: build/generated/
          if-no-files-found: error
          retention-days: 14
