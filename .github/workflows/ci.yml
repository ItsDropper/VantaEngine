name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Python authoring SDK
        env:
          PYTHONPATH: tools/vanta_sdk
        run: python -m unittest discover -s tools/vanta_sdk/tests -v

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format Rust editor sources
        run: cargo fmt --manifest-path editor/app/Cargo.toml --all

      - name: Generate Rust dependency lockfile
        run: cargo generate-lockfile --manifest-path editor/app/Cargo.toml

      - name: Test Rust editor
        run: cargo test --locked --manifest-path editor/app/Cargo.toml

      - name: Lint Rust editor
        run: cargo clippy --locked --all-targets --manifest-path editor/app/Cargo.toml -- -D warnings

      - name: Build Rust editor
        run: cargo build --locked --release --manifest-path editor/app/Cargo.toml

      - name: Prepare editor screenshot project
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "VantaEditorScreenshotProject"
          Copy-Item "projects/starter" $project -Recurse -Force
          $env:PYTHONPATH = Join-Path $PWD "tools/vanta_sdk"
          python -m vanta_sdk build --project $project --output (Join-Path $project "build/editor-assets")
          if ($LASTEXITCODE -ne 0) { throw "Could not generate screenshot project assets." }
          "VANTA_SCREENSHOT_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Capture editor screenshot
        shell: pwsh
        run: |
          ./editor/scripts/capture-editor-screenshot.ps1 `
            -ExecutablePath "editor/app/target/release/vanta-editor.exe" `
            -ProjectPath "$env:VANTA_SCREENSHOT_PROJECT" `
            -OutputPath "dist/screenshots/vantaengine-editor.png"

      - name: Upload editor screenshot
        uses: actions/upload-artifact@v4
        with:
          name: vantaengine-editor-screenshot
          path: dist/screenshots/vantaengine-editor.png
          if-no-files-found: error
          retention-days: 30

      - name: Generate starter model
        env:
          PYTHONPATH: tools/vanta_sdk
        run: python -m vanta_sdk build --project projects/starter --output build/generated

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build Debug
        run: cmake --build build --parallel

      - name: Test Debug
        run: ctest --test-dir build --output-on-failure

      - name: Build Release
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-release --parallel

      - name: Test Release
        run: ctest --test-dir build-release --output-on-failure

      - name: Package portable Windows editor
        shell: pwsh
        run: |
          $package = "dist/VantaEngine-Editor"
          New-Item -ItemType Directory -Force -Path "$package/resources" | Out-Null
          Copy-Item "editor/app/target/release/vanta-editor.exe" "$package/vanta-editor.exe"
          Copy-Item "tools/vanta_sdk" "$package/resources/vanta_sdk" -Recurse
          Copy-Item "editor/README.md" "$package/README.md"
          Compress-Archive -Path "$package/*" -DestinationPath "dist/VantaEngine-Editor-Windows-x64.zip" -Force

      - name: Upload portable editor
        uses: actions/upload-artifact@v4
        with:
          name: vantaengine-editor-windows-x64
          path: dist/VantaEngine-Editor-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated model
        uses: actions/upload-artifact@v4
        with:
          name: vantaengine-generated-models
          path: build/generated/
          if-no-files-found: error
          retention-days: 14
