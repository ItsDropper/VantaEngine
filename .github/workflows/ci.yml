name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Python authoring SDK
        env:
          PYTHONPATH: tools/vanta_sdk
        run: python -m unittest discover -s tools/vanta_sdk/tests -v

      - name: Test editor project workflow
        run: python editor/vanta_editor.py --self-test

      - name: Generate starter model
        env:
          PYTHONPATH: tools/vanta_sdk
        run: python -m vanta_sdk build --project projects/starter --output build/generated

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build Debug
        run: cmake --build build --parallel

      - name: Test Debug
        run: ctest --test-dir build --output-on-failure

      - name: Build Release
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-release --parallel

      - name: Test Release
        run: ctest --test-dir build-release --output-on-failure

      - name: Upload generated model
        uses: actions/upload-artifact@v4
        with:
          name: vantaengine-generated-models
          path: build/generated/
          if-no-files-found: error
          retention-days: 14
