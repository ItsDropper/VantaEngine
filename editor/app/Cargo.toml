[package]
name = "vantaengine-editor"
version = "0.1.0"
edition = "2021"
description = "Native Rust editor for VantaEngine projects and assets"
license = "MIT"

[[bin]]
name = "vanta-editor"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13.1", default-features = false, features = ["wgpu", "tokio"] }
rfd = "0.15.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.15"
