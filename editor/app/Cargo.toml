[package]
name = "vantaengine-editor"
version = "0.1.0"
edition = "2021"
description = "Native Rust editor for VantaEngine projects and assets"
license = "MIT"

[[bin]]
name = "vanta-editor"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
egui_dock = "0.22.0"
rfd = "0.15.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = "0.8.1"

[dev-dependencies]
tempfile = "3.15"
